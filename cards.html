<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1D2752">
<title>내 카드 혜택</title>
<style>
:root{--bg:#FFF6E9;--card:#fff;--ink:#1D2752;--sub:#6B7794;--line:#1D2752;--accent:#F0503C;--gold:#C9A227;--soft:#F6E7CF;--ok:#1E8E5A;--okbg:#E4F5EC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:60px}
header{padding:22px 16px 14px;border-bottom:3px solid var(--line)}
h1{margin:0;font-size:24px;letter-spacing:-.6px}
h1 span{color:var(--accent)}
.meta{color:var(--sub);font-size:12.5px;margin-top:4px}
section{padding:18px 14px 4px}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.4px}
h2::after{content:"";display:block;width:56px;height:6px;margin-top:5px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px)}
.mycards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 10px}
.mc .n{font-weight:800;font-size:14px}
.mc .s{font-size:11.5px;color:var(--sub)}
.mc select{margin-top:6px;width:100%;font:inherit;font-size:13px;padding:5px 6px;border:2px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink)}
.ev{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 11px;margin-bottom:8px;text-decoration:none;color:inherit}
.dd{flex:0 0 54px;text-align:center;font-weight:900;font-size:15px;border-radius:10px;padding:6px 0;background:var(--soft)}
.dd.hot{background:var(--accent);color:#fff}
.ev .t{font-weight:700;font-size:13.5px}
.ev .x{font-size:12px;color:var(--sub)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:4px;background:var(--soft)}
.pill.req{background:#FFE3DE;color:#B4321F}
.pill.done{background:var(--okbg);color:var(--ok)}
.searchbox{position:sticky;top:0;z-index:9;background:rgba(255,246,233,.97);backdrop-filter:blur(8px);padding:10px 14px 8px;border-bottom:2px solid var(--line)}
.searchbox input{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:3px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);outline:none}
.chips{margin-top:8px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-block;padding:5px 12px;margin-right:6px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;border:2px solid transparent;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.chip.loc{background:#fff;border-color:var(--line)}
.res .grp{margin-bottom:16px}
.res h3{font-size:15px;margin:0 0 7px;padding-left:9px;border-left:5px solid var(--line)}
.res h4{font-size:13.5px;margin:14px 0 6px;color:var(--accent)}
.row{background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 11px;margin-bottom:7px}
.row.no{opacity:.45;border-style:dashed}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .c{font-weight:900;font-size:14.5px}
.badge{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.ng{background:#FFE3DE;color:#B4321F}
.badge.q{background:var(--soft);color:var(--sub)}
.row .d{font-size:13.5px;margin-top:3px}
.row .k{font-size:12.5px;color:var(--sub);margin-top:3px}
.row .k b{color:var(--ink)}
.best{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.best .c::before{content:"★ ";color:var(--accent)}
.cardline{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cl{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft)}
.cl.ok{background:var(--okbg);color:var(--ok)}
.cl.ng{background:#FFE3DE;color:#B4321F}
.cl.q{color:var(--sub)}
.dist{font-size:12px;font-weight:800;color:var(--accent);white-space:nowrap}
.map{font-size:12px;font-weight:700;color:var(--ink);text-decoration:underline;white-space:nowrap}
.empty{color:var(--sub);font-size:13.5px;padding:10px 2px}
.foot{color:var(--sub);font-size:12px;padding:16px 14px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>내 카드 <span>혜택</span></h1>
  <div class="meta">카드 5장 · 혜택 기준일 <b id="asof"></b> · 공식 안내장 기준</div>
</header>

<section>
  <h2>이번 달 실적 (지난달 쓴 금액)</h2>
  <div class="mycards" id="mycards"></div>
</section>

<section>
  <h2>지금 진행 중인 행사</h2>
  <div id="events"></div>
</section>

<div class="searchbox">
  <input id="q" type="search" placeholder="호텔·동네·역·상황 (예: 삼성역, 드래곤시티, 라운지)" autocomplete="off">
  <div class="chips" id="chips"></div>
</div>
<section class="res" id="res"></section>

<div class="foot" id="foot"></div>

const CARD_ORDER = ["신한","레이디","삼성","KB","롯데"];
const NAME = {"신한":"신한 RPM","레이디":"신한 레이디","삼성":"삼성 THE 1","KB":"KB 헤리티지","롯데":"롯데 힐튼"};
const LEVELS = [["0","30만원 미만"],["30","30만~50만원"],["50","50만원 이상"]];
const store = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const spend = {}; CARD_ORDER.forEach(c=>spend[c]=store.get("spend_"+c,"50"));
let ladyBrand = store.get("lady_brand","VISA");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
const norm=s=>String(s).replace(/\s+/g,"").toLowerCase();

function need(txt){
  if(!txt||txt==="-") return null;
  if(/없음|전월 이용 있으면/.test(txt)) return 0;
  if(/확인 필요|전년|연회비 주기|첫해|구간/.test(txt)) return null;
  const m=txt.match(/(\d+)만원/); return m?parseInt(m[1],10):null;
}
function cardsOf(c){return c.split("·").map(s=>s.replace(/\(.*\)/,"").trim()).filter(Boolean)}
function judge(card,txt){
  if(/전월 이용 있으면/.test(txt||"")) return ["ok","지난달 1번만 쓰면 됨"];
  const n=need(txt); if(n===null) return ["q","조건 확인"];
  if(n===0) return ["ok","실적 무관"];
  return parseInt(spend[card],10)>=n?["ok","지금 가능"]:["ng",n+"만원 필요"];
}
function hotelsOf(c){const v=D.hotel_valet[c]; return (c==="레이디"&&ladyBrand==="UPI")?v.호텔_UPI:v.호텔}
const kakao=n=>"https://map.kakao.com/link/search/"+encodeURIComponent(n);

function drawCards(){
  document.getElementById("mycards").innerHTML = CARD_ORDER.map(c=>{
    const o=D.cards[c];
    const brand = c==="레이디" ? `<select data-b="1"><option value="VISA"${ladyBrand==="VISA"?" selected":""}>브랜드: VISA</option><option value="UPI"${ladyBrand==="UPI"?" selected":""}>브랜드: 은련(UPI)</option></select>` : "";
    return `<div class="mc"><div class="n">${esc(NAME[c])}</div><div class="s">${esc(c==="레이디"?"The LADY CLASSIC":o.브랜드)}</div>
    <select data-c="${esc(c)}">${LEVELS.map(([v,t])=>`<option value="${v}"${spend[c]===v?" selected":""}>${t}</option>`).join("")}</select>${brand}</div>`}).join("");
  document.querySelectorAll("#mycards select[data-c]").forEach(s=>s.onchange=()=>{spend[s.dataset.c]=s.value;store.set("spend_"+s.dataset.c,s.value);search()});
  document.querySelectorAll("#mycards select[data-b]").forEach(s=>s.onchange=()=>{ladyBrand=s.value;store.set("lady_brand",s.value);search()});
}

function drawEvents(){
  const today=new Date();today.setHours(0,0,0,0);
  const list=D.events.map(e=>{let days=null; if(/^\d{4}-\d{2}-\d{2}$/.test(e.마감)){days=Math.round((new Date(e.마감+"T00:00:00")-today)/864e5)} return {...e,days}})
    .filter(e=>e.days===null||e.days>=0).sort((a,b)=>(a.days??9999)-(b.days??9999));
  document.getElementById("events").innerHTML = list.length?list.map(e=>{
    const dd=e.days===null?"상시":(e.days===0?"오늘":"D-"+e.days);
    const cls=/필수/.test(e.응모)?"req":/완료/.test(e.응모)?"done":"";
    const tag=e.링크?"a":"div";
    return `<${tag} class="ev"${e.링크?` href="${esc(e.링크)}" target="_blank" rel="noopener"`:""}><div class="dd${e.days!==null&&e.days<=7?" hot":""}">${dd}</div>
      <div><div class="t">${esc(e.행사)}</div><div class="x"><span class="pill">${esc(e.카드)}</span><span class="pill ${cls}">응모 ${esc(e.응모)}</span>${e.마감!=="상시"?esc(e.마감.slice(5).replace("-","/"))+" 마감":""}</div></div></${tag}>`}).join(""):`<div class="empty">진행 중인 행사가 없어요.</div>`;
}

// ── 장소(호텔 발렛 + 무료주차) ──
// 같은 주소의 무료주차는 하나로 합침
const SPOTS=[];
D.places.forEach(p=>{
  if(p.종류==="호텔 발렛"){SPOTS.push({...p,cards:null});return}
  const same=SPOTS.find(s=>s.종류==="무료주차"&&s.주소===p.주소);
  if(same){if(!same.cards.includes(p.카드))same.cards.push(p.카드)} else SPOTS.push({...p,cards:[p.카드]});
});
function spotCards(s){ // [{c,k,t,info}]
  if(s.종류==="호텔 발렛") return CARD_ORDER.filter(c=>hotelsOf(c).includes(s.이름)).map(c=>{const v=D.hotel_valet[c];const [k,t]=judge(c,v.전월실적);return {c,k,t,info:`${v.횟수} · 무료주차 ${v.무료주차}`}});
  return s.cards.map(c=>{const v=D.parking[c];const [k,t]=judge(c,v.전월실적);return {c,k,t,info:`${v.조건} · ${v.방법}`}});
}
function spotRow(s,dist){
  const cs=spotCards(s); if(!cs.length) return "";
  const rec=s.종류==="호텔 발렛"?cs.map(x=>D.hotel_valet[x.c].영수증금액[s.이름]).find(Boolean):null;
  const anyOk=cs.some(x=>x.k==="ok");
  return `<div class="row${anyOk?" best":""}"><div class="top"><span class="c">${esc(s.이름)}</span>${dist!=null?`<span class="dist">${dist<1?Math.round(dist*1000)+"m":dist.toFixed(1)+"km"}</span>`:""}</div>
    <div class="k">${esc(s.종류==="호텔 발렛"?"호텔 무료 발렛 (영수증 필요)":"1일 무료주차")} · ${esc(s.주소)} · <a class="map" href="${kakao(s.이름)}" target="_blank" rel="noopener">지도</a></div>
    ${rec?`<div class="k">영수증 <b>${esc(rec)}</b> 이상</div>`:""}
    <div class="cardline">${cs.map(x=>`<span class="cl ${x.k}">${esc(NAME[x.c])} · ${esc(x.t)}</span>`).join("")}</div></div>`;
}
const REGION_ORDER=["서울","경기","인천","부산","대구","대전","울산","광주","강원","충남","전북","전남","경북","경남","제주"];
function regionOf(a){const t=a.split(" ")[0].replace("강원특별자치도","강원");return t}
function parkingList(){
  const by={}; SPOTS.forEach(s=>{if(!spotCards(s).length)return;(by[regionOf(s.주소)]=by[regionOf(s.주소)]||[]).push(s)});
  const regs=Object.keys(by).sort((a,b)=>REGION_ORDER.indexOf(a)-REGION_ORDER.indexOf(b));
  const head=`<div class="grp"><h3>무료주차 · 무료 발렛 전체 (${SPOTS.filter(s=>spotCards(s).length).length}곳)</h3>
   <div class="row"><div class="k"><b>1일 무료주차</b> — 신한 RPM: ${esc(D.parking.신한.조건)} / 삼성 THE 1: ${esc(D.parking.삼성.조건)}</div>
   <div class="k"><b>호텔 무료 발렛</b> — 호텔에서 밥 먹거나 묵은 날, 2~3시간 무료 (영수증 필요)</div>
   <div class="k">초록색 카드가 지금 실적으로 되는 카드예요. 동네 이름을 검색하면 가까운 순서로 보여요.</div></div>`;
  return head+regs.map(r=>`<h4>${esc(r)} (${by[r].length})</h4>`+by[r].sort((a,b)=>a.종류===b.종류?a.이름.localeCompare(b.이름):a.종류==="무료주차"?-1:1).map(s=>spotRow(s,null)).join("")).join("")+`</div>`;
}
function km(a,b){const R=6371,t=x=>x*Math.PI/180;const dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function nearBlock(label,ll){
  const list=SPOTS.filter(s=>s.좌표&&spotCards(s).length).map(s=>({s,d:km(ll,s.좌표)})).sort((a,b)=>a.d-b.d);
  const within=list.filter(x=>x.d<=5); const show=(within.length?within:list.slice(0,5)).slice(0,15);
  return `<div class="grp"><h3>${esc(label)} 근처 무료주차·발렛</h3>${within.length?"":`<div class="empty">5km 안에는 없어요. 가장 가까운 곳이에요.</div>`}${show.map(x=>spotRow(x.s,x.d)).join("")}</div>`;
}
const GEO={}; let geoSeq=0;
async function geocode(q){
  if(GEO[q]!==undefined) return GEO[q];
  try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q="+encodeURIComponent(q));const j=await r.json();GEO[q]=j[0]?{ll:[+j[0].lat,+j[0].lon],name:j[0].display_name.split(",")[0]}:null}catch(e){GEO[q]=null}
  return GEO[q];
}

// ── 혜택 ──
const SITUS=[...new Set(D.benefits.map(b=>b.상황))];
const CHIPS=["무료주차","호텔 발렛","인천공항 발렛","라운지","공항 커피","택시","스타벅스","바우처","적립","캐시백","일본","호텔 할인"];
const ALIAS={"발렛":"발렛","발레":"발렛","커피":"커피","택시":"택시","적립":"적립","마일":"적립","포인트":"적립","일본":"일본","돈키":"돈키호테","리무진":"리무진","공항철도":"리무진","숙박":"숙박","기프트":"바우처","상품권":"바우처","쿠폰":"바우처","캐시백":"캐시백","쇼핑":"캐시백","브런치":"브런치","영화":"영화","놀이공원":"놀이공원","에버랜드":"놀이공원","롯데월드":"놀이공원","주유":"주유"};

function hotelBlock(h){
  const rows=CARD_ORDER.map(c=>{
    const v=D.hotel_valet[c]; const has=hotelsOf(c).includes(h);
    if(!has) return {html:()=>`<div class="row no"><div class="top"><span class="c">${esc(NAME[c])}</span><span class="badge q">이 호텔 안 됨</span></div></div>`};
    const [k,t]=judge(c,v.전월실적); const rec=v.영수증금액[h];
    return {has,ok:k==="ok",html:(cls)=>`<div class="row ${cls}"><div class="top"><span class="c">${esc(NAME[c])}</span><span class="badge ${k}">${t}</span></div>
      <div class="d">무료 발렛 · ${esc(v.횟수)}</div>
      <div class="k">전월실적 <b>${esc(v.전월실적)}</b> · 무료주차 ${esc(v.무료주차)}${rec?` · 영수증 <b>${esc(rec)}</b>`:""}</div><div class="k">${esc(v.주의)}</div></div>`};
  });
  const firstOk=rows.find(x=>x.has&&x.ok);
  const sp=SPOTS.find(s=>s.이름===h);
  return `<div class="grp"><h3>${esc(h)} 발렛${sp?` <a class="map" href="${kakao(h)}" target="_blank" rel="noopener">지도</a>`:""}</h3>${rows.map(x=>x.html(x===firstOk?"best":"")).join("")}</div>`;
}
function benefitRow(b,best,label){
  const cs=cardsOf(b.카드); const no=b.내용==="제공 안 함";
  const [k,t]=no?["q","없음"]:judge(cs[0],b.전월실적);
  const who=label||cs.map(c=>NAME[c]||c).join(" · ");
  return `<div class="row ${no?"no":""} ${best?"best":""}"><div class="top"><span class="c">${esc(who)}</span><span class="badge ${k}">${t}</span></div>
    <div class="d">${esc(b.내용)}</div>
    ${no?"":`<div class="k">횟수 <b>${esc(b.횟수)}</b> · 전월실적 <b>${esc(b.전월실적)}</b></div>${b.방법&&b.방법!=="-"?`<div class="k">${esc(b.방법)}</div>`:""}`}</div>`;
}
function situBlock(s){
  const order=D.benefits.filter(b=>b.상황===s).map(b=>{const [k]=judge(cardsOf(b.카드)[0],b.전월실적);return {b,ok:k==="ok"&&b.내용!=="제공 안 함"}});
  order.sort((a,b)=>(b.ok-a.ok)); const firstOk=order.find(o=>o.ok);
  return `<div class="grp"><h3>${esc(s)}</h3>${order.map(o=>benefitRow(o.b,o===firstOk)).join("")}</div>`;
}
function hotelValetAll(){
  return `<div class="grp"><h3>호텔 발렛 — 카드별 조건</h3>${CARD_ORDER.map(c=>{const v=D.hotel_valet[c];const hs=hotelsOf(c);const [k,t]=judge(c,v.전월실적);
    return `<div class="row"><div class="top"><span class="c">${esc(NAME[c])} · ${hs.length}곳</span><span class="badge ${k}">${t}</span></div><div class="k">${esc(v.횟수)} · 전월실적 <b>${esc(v.전월실적)}</b> · 무료주차 ${esc(v.무료주차)}</div><div class="k">${hs.map(esc).join(" · ")}</div></div>`}).join("")}</div>`;
}

function search(){
  const raw=document.getElementById("q").value.trim(); const q=norm(raw); const my=++geoSeq;
  document.querySelectorAll(".chip[data-t]").forEach(c=>c.classList.toggle("on",norm(c.dataset.t)===q));
  const out=[];
  if(!q){
    out.push(`<div class="empty">호텔 이름, 동네·역 이름(예: <b>삼성역</b>), 상황(예: 라운지)을 넣거나 버튼을 눌러 보세요. 지금 실적으로 쓸 수 있는 카드엔 <b>★</b>와 <b>초록색</b>이 붙어요.</div>`);
    return show(out);
  }
  if(/무료주차|무료주차장|주차장목록|주차리스트/.test(q)) out.push(parkingList());
  const hs=[...new Set(CARD_ORDER.flatMap(hotelsOf).concat(Object.keys(D.hotel_valet).flatMap(c=>D.hotel_valet[c].호텔)))].filter(h=>norm(h).includes(q)||(q.length>=3&&q.includes(norm(h))));
  hs.slice(0,6).forEach(h=>out.push(hotelBlock(h)));
  const ps=SPOTS.filter(s=>s.종류==="무료주차"&&(norm(s.이름).includes(q)||norm(s.주소).includes(q))&&!/무료주차/.test(q));
  if(ps.length) out.push(`<div class="grp"><h3>무료주차 장소</h3>${ps.slice(0,10).map(s=>spotRow(s,null)).join("")}</div>`);
  if(/호텔발렛|호텔발레|발렛호텔/.test(q)) out.push(hotelValetAll());
  let key=q; if(!/호텔|무료주차/.test(q)) Object.entries(ALIAS).forEach(([a,b])=>{if(q.includes(norm(a)))key=b});
  const ss=/무료주차/.test(q)?[]:SITUS.filter(s=>norm(s).includes(q)||norm(s).includes(norm(key))||D.benefits.some(b=>b.상황===s&&norm(b.내용).includes(q)));
  ss.forEach(s=>out.push(situBlock(s)));
  CARD_ORDER.forEach(c=>{ if(q===norm(c)||q===norm(NAME[c])||(q.length>=3&&norm(D.cards[c].이름).includes(q))){
    const rows=D.benefits.filter(b=>cardsOf(b.카드).includes(c)&&b.내용!=="제공 안 함"); const v=D.hotel_valet[c];
    out.push(`<div class="grp"><h3>${esc(D.cards[c].이름)} 전체</h3><div class="row"><div class="k">연회비 ${esc(D.cards[c].연회비)} · ${esc(D.cards[c].브랜드)}</div><div class="d">호텔 발렛 ${hotelsOf(c).length}곳 · ${esc(v.횟수)} · 전월 ${esc(v.전월실적)}</div></div>${rows.map(b=>benefitRow(b,false,b.상황)).join("")}</div>`);
  }});
  // 동네·역 이름이면 지도에서 찾아 가까운 곳 보여주기
  const placeLike=/(역|동|구|시|군|읍|면|로|길|공항|터미널|타워|빌딩|백화점|코엑스|센터|몰)$/.test(raw.replace(/\s+/g,""));
  if(out.length===0||placeLike){
    out.push(`<div class="grp" id="near"><div class="empty">"${esc(raw)}" 주변 무료주차를 찾는 중…</div></div>`);
    geocode(raw).then(r=>{ if(my!==geoSeq) return; const el=document.getElementById("near"); if(!el) return;
      el.outerHTML = r ? nearBlock(raw,r.ll) : (out.length>1?"":`<div class="empty">"${esc(raw)}"에 맞는 혜택이나 장소를 못 찾았어요. 호텔은 이름 일부만 넣어도 돼요 (예: 신라, 콘래드).</div>`);
    });
  }
  show(out);
}
function show(out){document.getElementById("res").innerHTML=out.join("")}
function nearMe(){
  const res=document.getElementById("res");
  if(!navigator.geolocation){res.innerHTML=`<div class="empty">이 휴대폰에서는 위치를 쓸 수 없어요. 동네 이름으로 검색해 주세요.</div>`;return}
  res.innerHTML=`<div class="empty">내 위치를 찾는 중…</div>`; document.getElementById("q").value="";
  navigator.geolocation.getCurrentPosition(p=>{res.innerHTML=nearBlock("내 위치",[p.coords.latitude,p.coords.longitude])},()=>{res.innerHTML=`<div class="empty">위치 사용을 허용해 주세요. 아니면 동네 이름으로 검색해도 돼요.</div>`},{enableHighAccuracy:false,timeout:10000});
}

document.getElementById("asof").textContent=D.기준일;
document.getElementById("chips").innerHTML=`<span class="chip loc" id="nearme">📍 내 주변</span>`+CHIPS.map(c=>`<span class="chip" data-t="${c}">${c}</span>`).join("");
document.getElementById("nearme").onclick=nearMe;
document.querySelectorAll(".chip[data-t]").forEach(c=>c.onclick=()=>{const i=document.getElementById("q");i.value=(i.value===c.dataset.t?"":c.dataset.t);search()});
let tm; document.getElementById("q").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(search,350)});
document.getElementById("foot").innerHTML="출처: "+CARD_ORDER.map(c=>`${esc(NAME[c])} — ${esc(D.cards[c].출처)}`).join("<br>")+"<br>‘조건 확인’은 안내장에서 조건을 확실히 못 읽은 항목이에요. 위치 검색은 OpenStreetMap을 써요.";
drawCards(); drawEvents(); search();
</script>
