<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1D2752">
<title>내 카드 혜택</title>
<style>
:root{--bg:#FFF6E9;--card:#fff;--ink:#1D2752;--sub:#6B7794;--line:#1D2752;--accent:#F0503C;--gold:#C9A227;--soft:#F6E7CF;--ok:#1E8E5A;--okbg:#E4F5EC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:60px}
header{padding:22px 16px 14px;border-bottom:3px solid var(--line)}
h1{margin:0;font-size:24px;letter-spacing:-.6px}
h1 span{color:var(--accent)}
.meta{color:var(--sub);font-size:12.5px;margin-top:4px}
section{padding:18px 14px 4px}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.4px}
h2::after{content:"";display:block;width:56px;height:6px;margin-top:5px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px)}
/* 실적 스위치 */
.mycards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 10px}
.mc .n{font-weight:800;font-size:14px}
.mc .s{font-size:11.5px;color:var(--sub)}
.mc select{margin-top:6px;width:100%;font:inherit;font-size:13px;padding:5px 6px;border:2px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink)}
/* 행사 */
.ev{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 11px;margin-bottom:8px;text-decoration:none;color:inherit}
.dd{flex:0 0 54px;text-align:center;font-weight:900;font-size:15px;border-radius:10px;padding:6px 0;background:var(--soft)}
.dd.hot{background:var(--accent);color:#fff}
.ev .t{font-weight:700;font-size:13.5px}
.ev .x{font-size:12px;color:var(--sub)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:4px;background:var(--soft)}
.pill.req{background:#FFE3DE;color:#B4321F}
.pill.done{background:var(--okbg);color:var(--ok)}
/* 검색 */
.searchbox{position:sticky;top:0;z-index:9;background:rgba(255,246,233,.97);backdrop-filter:blur(8px);padding:10px 14px 8px;border-bottom:2px solid var(--line)}
.searchbox input{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:3px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);outline:none}
.chips{margin-top:8px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-block;padding:5px 12px;margin-right:6px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;border:2px solid transparent}
.chip.on{background:var(--ink);color:#fff}
.res .grp{margin-bottom:16px}
.res h3{font-size:15px;margin:0 0 7px;padding-left:9px;border-left:5px solid var(--line)}
.row{background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 11px;margin-bottom:7px}
.row.no{opacity:.45;border-style:dashed}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .c{font-weight:900;font-size:14.5px}
.row .badge{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.ng{background:#FFE3DE;color:#B4321F}
.badge.q{background:var(--soft);color:var(--sub)}
.row .d{font-size:13.5px;margin-top:3px}
.row .k{font-size:12.5px;color:var(--sub);margin-top:3px}
.row .k b{color:var(--ink)}
.best{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.best .c::before{content:"★ ";color:var(--accent)}
.empty{color:var(--sub);font-size:13.5px;padding:10px 2px}
.foot{color:var(--sub);font-size:12px;padding:16px 14px;line-height:1.6}
.foot a{color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>내 카드 <span>혜택</span></h1>
  <div class="meta">카드 4장 · 혜택 기준일 <b id="asof"></b> · 공식 안내장 기준</div>
</header>

<section>
  <h2>이번 달 실적 (지난달 쓴 금액)</h2>
  <div class="mycards" id="mycards"></div>
</section>

<section>
  <h2>지금 진행 중인 행사</h2>
  <div id="events"></div>
</section>

<div class="searchbox">
  <input id="q" type="search" placeholder="호텔 이름이나 상황을 입력 (예: 드래곤시티, 라운지, 택시)" autocomplete="off">
  <div class="chips" id="chips"></div>
</div>
<section class="res" id="res"></section>

<div class="foot" id="foot"></div>

  if(/없음|전월 이용 있으면/.test(txt)) return 0;
  if(/확인 필요/.test(txt)) return null;
  if(/전년|연회비 주기|첫해|구간/.test(txt)) return null;
  const m=txt.match(/(\d+)만원/); return m?parseInt(m[1],10):null;
}
function cardsOf(c){return c.split("·").map(s=>s.replace(/\(.*\)/,"").trim()).filter(Boolean)}
function judge(card,txt){
  const n=need(txt); if(n===null) return ["q","조건 확인"];
  if(n===0) return ["ok","실적 무관"];
  return parseInt(spend[card],10)>=n?["ok","지금 가능"]:["ng",n+"만원 필요"];
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));

// 내 카드
function drawCards(){
  document.getElementById("mycards").innerHTML = CARD_ORDER.map(c=>{
    const o=D.cards[c];
    return `<div class="mc"><div class="n">${esc(c)}</div><div class="s">${esc(o.이름.replace(/^\S+\s/,""))} · ${esc(o.브랜드)}</div>
    <select data-c="${esc(c)}">${LEVELS.map(([v,t])=>`<option value="${v}"${spend[c]===v?" selected":""}>${t}</option>`).join("")}</select></div>`}).join("");
  document.querySelectorAll("#mycards select").forEach(s=>s.onchange=()=>{spend[s.dataset.c]=s.value;store.set("spend_"+s.dataset.c,s.value);search()});
}

// 행사 (마감 지난 건 자동으로 숨김)
function drawEvents(){
  const today=new Date();today.setHours(0,0,0,0);
  const list=D.events.map(e=>{
    let days=null; if(/^\d{4}-\d{2}-\d{2}$/.test(e.마감)){const d=new Date(e.마감+"T00:00:00");days=Math.round((d-today)/864e5)}
    return {...e,days};
  }).filter(e=>e.days===null||e.days>=0).sort((a,b)=>(a.days??9999)-(b.days??9999));
  document.getElementById("events").innerHTML = list.length?list.map(e=>{
    const dd=e.days===null?"상시":(e.days===0?"오늘":"D-"+e.days);
    const cls=/필수/.test(e.응모)?"req":/완료/.test(e.응모)?"done":"";
    const tag=e.링크?"a":"div";
    return `<${tag} class="ev"${e.링크?` href="${esc(e.링크)}" target="_blank" rel="noopener"`:""}><div class="dd${e.days!==null&&e.days<=7?" hot":""}">${dd}</div>
      <div><div class="t">${esc(e.행사)}</div><div class="x"><span class="pill">${esc(e.카드)}</span><span class="pill ${cls}">응모 ${esc(e.응모)}</span>${e.마감!=="상시"?esc(e.마감.slice(5).replace("-","/"))+" 마감":""}</div></div></${tag}>`}).join(""):`<div class="empty">진행 중인 행사가 없어요.</div>`;
}

// 검색 재료 만들기
const norm=s=>s.replace(/\s+/g,"").toLowerCase();
const HOTELS={}; // 호텔 → [{card,...}]
Object.entries(D.hotel_valet).forEach(([card,v])=>v.호텔.forEach(h=>{(HOTELS[h]=HOTELS[h]||[]).push(card)}));
const SITUS=[...new Set(D.benefits.map(b=>b.상황))];
const CHIPS=["호텔 발렛","인천공항 발렛","라운지","공항 커피","주차","택시","스타벅스","바우처","적립","일본","호텔 할인"];
const ALIAS={"발렛":"발렛","발레":"발렛","발레파킹":"발렛","라운지":"라운지","커피":"커피","주차":"주차","택시":"택시","적립":"적립","마일":"적립","포인트":"적립","일본":"일본","돈키":"돈키호테","리무진":"리무진","공항철도":"리무진","숙박":"숙박","기프트":"바우처","상품권":"바우처","쿠폰":"바우처"};

function hotelBlock(h){
  const cards=CARD_ORDER.map(c=>{
    const v=D.hotel_valet[c]; const has=v.호텔.includes(h);
    if(!has) return {c,has,html:`<div class="row no"><div class="top"><span class="c">${esc(c)}</span><span class="badge q">이 호텔 안 됨</span></div></div>`};
    const [k,t]=judge(c,v.전월실적); const rec=v.영수증금액[h];
    return {c,has,ok:k==="ok",html:(cls)=>`<div class="row ${cls}"><div class="top"><span class="c">${esc(c)}</span><span class="badge ${k}">${t}</span></div>
      <div class="d">무료 발렛 · ${esc(v.횟수)}</div>
      <div class="k">전월실적 <b>${esc(v.전월실적)}</b> · 무료주차 ${esc(v.무료주차)}${rec?` · 영수증 <b>${esc(rec)}</b>`:""}</div><div class="k">${esc(v.주의)}</div></div>`};
  });
  const firstOk=cards.find(x=>x.has&&x.ok);
  return `<div class="grp"><h3>${esc(h)} 발렛</h3>${cards.map(x=>x.has?x.html(x===firstOk?"best":""):x.html).join("")}</div>`;
}
function benefitRow(b,best,label){
  const cs=cardsOf(b.카드); const [k,t]=b.내용==="제공 안 함"?["q","없음"]:judge(cs[0],b.전월실적);
  const no=b.내용==="제공 안 함";
  return `<div class="row ${no?"no":""} ${best?"best":""}"><div class="top"><span class="c">${esc(label||b.카드)}</span><span class="badge ${k}">${t}</span></div>
    <div class="d">${esc(b.내용)}</div>
    ${no?"":`<div class="k">횟수 <b>${esc(b.횟수)}</b> · 전월실적 <b>${esc(b.전월실적)}</b></div>${b.방법&&b.방법!=="-"?`<div class="k">${esc(b.방법)}</div>`:""}`}</div>`;
}
function situBlock(s){
  const rows=D.benefits.filter(b=>b.상황===s);
  const order=rows.map(b=>{const cs=cardsOf(b.카드);const [k]=judge(cs[0],b.전월실적);return {b,ok:k==="ok"&&b.내용!=="제공 안 함"}});
  const firstOk=order.find(o=>o.ok);
  order.sort((a,b)=>(b.ok-a.ok));
  return `<div class="grp"><h3>${esc(s)}</h3>${order.map(o=>benefitRow(o.b,o===firstOk)).join("")}</div>`;
}

function search(){
  const raw=document.getElementById("q").value.trim(); const q=norm(raw);
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",norm(c.textContent)===q));
  const out=[];
  if(!q){
    out.push(`<div class="empty">위 칸에 호텔 이름이나 상황을 입력하거나, 버튼을 눌러 보세요. 지금 실적으로 쓸 수 있는 카드엔 <b>★</b>와 <b>지금 가능</b>이 붙어요.</div>`);
  } else {
    // 1) 호텔 이름
    const hs=Object.keys(HOTELS).filter(h=>norm(h).includes(q)||q.includes(norm(h)));
    hs.slice(0,6).forEach(h=>out.push(hotelBlock(h)));
    // 2) 호텔 발렛 전체 목록
    if(/호텔발렛|호텔발레|발렛호텔/.test(q)){
      out.push(`<div class="grp"><h3>호텔 발렛 — 카드별 조건</h3>${CARD_ORDER.map(c=>{const v=D.hotel_valet[c];const [k,t]=judge(c,v.전월실적);
        return `<div class="row"><div class="top"><span class="c">${esc(c)} · ${v.호텔.length}곳</span><span class="badge ${k}">${t}</span></div><div class="k">${esc(v.횟수)} · 전월실적 <b>${esc(v.전월실적)}</b> · 무료주차 ${esc(v.무료주차)}</div><div class="k">${v.호텔.map(esc).join(" · ")}</div></div>`}).join("")}</div>`);
    }
    // 3) 상황
    let key=q; if(!/호텔/.test(q)) Object.entries(ALIAS).forEach(([a,b])=>{if(q.includes(norm(a)))key=b});
    const ss=SITUS.filter(s=>norm(s).includes(q)||norm(s).includes(norm(key))||D.benefits.some(b=>b.상황===s&&norm(b.내용).includes(q)));
    ss.forEach(s=>out.push(situBlock(s)));
    // 4) 카드 이름
    CARD_ORDER.forEach(c=>{ if(q===norm(c)||norm(D.cards[c].이름).includes(q)&&q.length>=2){
      const rows=D.benefits.filter(b=>cardsOf(b.카드).includes(c)&&b.내용!=="제공 안 함");
      const v=D.hotel_valet[c];
      out.push(`<div class="grp"><h3>${esc(D.cards[c].이름)} 전체</h3><div class="row"><div class="k">연회비 ${esc(D.cards[c].연회비)} · ${esc(D.cards[c].브랜드)}</div><div class="d">호텔 발렛 ${v.호텔.length}곳 · ${esc(v.횟수)} · 전월 ${esc(v.전월실적)}</div></div>${rows.map(b=>benefitRow(b,false,b.상황)).join("")}</div>`);
    }});
    if(out.length===0) out.push(`<div class="empty">"${esc(raw)}"에 맞는 혜택을 못 찾았어요. 호텔은 이름 일부만 넣어도 돼요 (예: 신라, 콘래드).</div>`);
  }
  document.getElementById("res").innerHTML=out.join("");
}

document.getElementById("asof").textContent=D.기준일;
document.getElementById("chips").innerHTML=CHIPS.map(c=>`<span class="chip">${c}</span>`).join("");
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const i=document.getElementById("q");i.value=(i.value===c.textContent?"":c.textContent);search()});
document.getElementById("q").addEventListener("input",search);
document.getElementById("foot").innerHTML="출처: "+CARD_ORDER.map(c=>`${esc(c)} — ${esc(D.cards[c].출처)}`).join("<br>")+"<br>‘조건 확인’은 안내장에서 조건을 확실히 못 읽은 항목이에요.";
drawCards(); drawEvents(); search();
</script>
</body>
</html>
